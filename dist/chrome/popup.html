<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FontSnatch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="20" height="20" />
        <span>FontSnatch</span>
      </div>
      <span id="site" class="site"></span>
      <button id="reload" class="icon" type="button" title="Reload" aria-label="Reload">⟳</button>
    </header>

    <div class="toolbar">
      <div id="filters" class="chips" role="group" aria-label="Filter fonts">
        <button type="button" class="chip active" data-filter="used">Used</button>
        <button type="button" class="chip" data-filter="all">All</button>
        <button type="button" class="chip" data-filter="downloadable">With source</button>
      </div>
      <input id="search" type="search" placeholder="Search fonts…" autocomplete="off" />
    </div>

    <div class="preview-row">
      <label for="preview-text">Preview</label>
      <input id="preview-text" type="text" autocomplete="off" />
    </div>

    <div id="status" class="status" role="status"></div>

    <main id="font-list" class="list"></main>
    <div id="empty" class="empty" hidden></div>

    <section id="unassigned" class="unassigned" hidden>
      <h3>Unmatched files</h3>
      <div id="unassigned-list"></div>
    </section>

    <footer class="bottom">
      <span class="hint">Only download fonts you have the rights to use.</span>
      <div class="bottom-actions">
        <select id="zip-format" title="Format for bulk download">
          <option value="native">Original</option>
          <option value="woff">WOFF</option>
        </select>
        <button id="zip-button" type="button" class="primary" disabled>Download ZIP</button>
        <button id="settings" type="button" class="icon" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </footer>

    <div id="settings-panel" class="settings" hidden>
      <label class="check">
        <input id="allow-mismatch" type="checkbox" />
        <span>Allow mismatched file extension (content stays unchanged)</span>
      </label>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
