<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FontSnatch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="18" height="18" />
        <span>FontSnatch</span>
      </div>
      <span id="site" class="site"></span>
      <button id="reload" class="icon" type="button" title="Neu laden" aria-label="Neu laden">⟳</button>
    </header>

    <div class="toolbar">
      <div id="filters" class="chips" role="group" aria-label="Filter">
        <button type="button" class="chip active" data-filter="used">Genutzt</button>
        <button type="button" class="chip" data-filter="all">Alle</button>
        <button type="button" class="chip" data-filter="downloadable">Nur ladbar</button>
      </div>
      <input id="search" type="search" placeholder="Font suchen …" autocomplete="off" />
    </div>

    <div class="preview-row">
      <label for="preview-text">Vorschau</label>
      <input id="preview-text" type="text" autocomplete="off" />
    </div>

    <div id="status" class="status" role="status"></div>

    <main id="font-list" class="list"></main>
    <div id="empty" class="empty" hidden></div>

    <section id="unassigned" class="unassigned" hidden>
      <h3>Nicht zugeordnete Dateien</h3>
      <div id="unassigned-list"></div>
    </section>

    <footer class="bottom">
      <span class="hint">Nur Fonts verwenden, für die du Rechte hast.</span>
      <div class="bottom-actions">
        <select id="zip-format" title="Format für den Sammeldownload">
          <option value="native">Original</option>
          <option value="woff">WOFF</option>
        </select>
        <button id="zip-button" type="button" class="ghost" disabled>Alles als ZIP</button>
        <button id="settings" type="button" class="icon" title="Einstellungen" aria-label="Einstellungen">⚙</button>
      </div>
    </footer>

    <div id="settings-panel" class="settings" hidden>
      <label class="check">
        <input id="allow-mismatch" type="checkbox" />
        <span>Falsche Dateiendung erlauben (Inhalt bleibt unverändert)</span>
      </label>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
